    <circle cx="50" cy="71" r="5" fill="#1B1B3A"/>
    <circle cx="52" cy="69" r="2" fill="#FFFFFF"/>
    
    <ellipse cx="78" cy="70" rx="9" ry="11" fill="#FFFFFF" stroke="#1B1B3A" stroke-width="3"/>
    <circle cx="78" cy="71" r="5" fill="#1B1B3A"/>
    <circle cx="80" cy="69" r="2" fill="#FFFFFF"/>

