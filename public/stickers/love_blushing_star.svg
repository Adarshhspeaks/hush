    <path d="M26 36 C23 33 20 30 20 28 C20 26 22 24 24 24 C25 24 26 25 26 26 C27 25 28 24 30 24 C32 24 34 26 34 28 C34 30 31 33 26 36 Z" fill="#FF5C8A" stroke="#FFFFFF" stroke-width="1.5"/>
