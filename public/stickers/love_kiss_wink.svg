<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#1B1B3A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Main face die-cut -->
    <circle cx="56" cy="64" r="44" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="56" cy="64" r="44" fill="#FFD84D" stroke="#1B1B3A" stroke-width="4"/>

    <!-- Left open eye -->
    <ellipse cx="38" cy="56" rx="8" ry="10" fill="#FFFFFF" stroke="#1B1B3A" stroke-width="3"/>
    <circle cx="38" cy="57" r="5" fill="#1B1B3A"/>
    <circle cx="40" cy="54" r="2" fill="#FFFFFF"/>
    <!-- Eyebrow -->
    <path d="M30 44 Q38 38 46 44" fill="none" stroke="#1B1B3A" stroke-width="3" stroke-linecap="round"/>

    <!-- Right winking eye -->
    <path d="M66 58 Q74 50 82 58" fill="none" stroke="#1B1B3A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M66 46 Q74 42 82 48" fill="none" stroke="#1B1B3A" stroke-width="3" stroke-linecap="round"/>

    <!-- Kissing mouth (puckered to the right) -->
    <path d="M68 76 Q78 72 74 80 Q78 88 68 84 Z" fill="#FF5C8A" stroke="#1B1B3A" stroke-width="3"/>

    <!-- Blushing cheek -->
    <ellipse cx="28" cy="72" rx="7" ry="4" fill="#FF5C8A" opacity="0.6"/>

    <!-- Blown floating heart -->
    <path d="M102 62 C94 54 86 46 86 40 C86 34 91 30 96 30 C99 30 101 32 102 34 C103 32 105 30 108 30 C113 30 118 34 118 40 C118 46 110 54 102 62 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <path d="M102 62 C94 54 86 46 86 40 C86 34 91 30 96 30 C99 30 101 32 102 34 C103 32 105 30 108 30 C113 30 118 34 118 40 C118 46 110 54 102 62 Z" fill="#FF5C8A" stroke="#1B1B3A" stroke-width="3" stroke-linejoin="round"/>

    <!-- Kiss breeze lines -->
    <path d="M78 68 Q84 66 88 70" fill="none" stroke="#5EE6B0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M82 76 Q88 74 94 78" fill="none" stroke="#5EE6B0" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
