<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#1B1B3A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tilted diamond rectangle badge outline -->
    <path d="M14 48 L114 24 L114 80 L14 104 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M14 48 L114 24 L114 80 L14 104 Z" fill="#5EE6B0" stroke="#1B1B3A" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Inner decorative border -->
