    <path d="M102 34 L102 28 C102 25 104 24 106 24 C108 24 108 27 108 29 L108 31 L111 31 C113 31 114 32 113 34 L111 38 C110 39 108 40 106 40 L102 40 Z" fill="#FF5C8A" stroke="#1B1B3A" stroke-width="1.5"/>
