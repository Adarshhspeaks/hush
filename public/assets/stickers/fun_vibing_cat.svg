<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#1B1B3A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Headphone arch outline -->
    <path d="M26 64 C26 36 42 22 64 22 C86 22 102 36 102 64" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <path d="M26 64 C26 36 42 22 64 22 C86 22 102 36 102 64" fill="none" stroke="#1B1B3A" stroke-width="10" stroke-linecap="round"/>
    <path d="M26 64 C26 36 42 22 64 22 C86 22 102 36 102 64" fill="none" stroke="#FF5C8A" stroke-width="5" stroke-linecap="round"/>

    <!-- Cat head outline -->
    <path d="M30 52 L38 28 L56 42 C61 40 67 40 72 42 L90 28 L98 52 C104 62 106 74 102 86 C96 106 82 116 64 116 C46 116 32 106 26 86 C22 74 24 62 30 52 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M30 52 L38 28 L56 42 C61 40 67 40 72 42 L90 28 L98 52 C104 62 106 74 102 86 C96 106 82 116 64 116 C46 116 32 106 26 86 C22 74 24 62 30 52 Z" fill="#F4F8FD" stroke="#1B1B3A" stroke-width="4" stroke-linejoin="round"/>

    <!-- Headphone ear pads -->
    <rect x="18" y="52" width="14" height="26" rx="7" fill="#FF5C8A" stroke="#1B1B3A" stroke-width="3"/>
    <rect x="96" y="52" width="14" height="26" rx="7" fill="#FF5C8A" stroke="#1B1B3A" stroke-width="3"/>

    <!-- Vibing / closed curved eyes -->
    <path d="M42 66 Q50 74 58 66" fill="none" stroke="#1B1B3A" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 66 Q78 74 86 66" fill="none" stroke="#1B1B3A" stroke-width="4" stroke-linecap="round"/>

    <!-- Happy mouth and whiskers -->
    <polygon points="64,74 61,71 67,71" fill="#FF5C8A"/>
    <path d="M57 78 Q64 83 64 74 Q64 83 71 78" fill="none" stroke="#1B1B3A" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Music notes -->
    <path d="M106 32 L116 26 L116 40 M106 32 L106 44" stroke="#5EE6B0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="103" cy="44" r="4" fill="#5EE6B0"/>
    <circle cx="113" cy="40" r="4" fill="#5EE6B0"/>
  </g>
</svg>
