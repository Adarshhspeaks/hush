<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#1B1B3A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Crown die-cut outline -->
    <polygon points="44,22 52,38 64,18 76,38 84,22 88,48 40,48" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Potato body die-cut outline -->
    <path d="M30 64 C22 84 34 112 64 112 C94 112 106 84 98 64 C92 46 82 42 64 42 C46 42 36 46 30 64 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Potato body fill -->
    <path d="M30 64 C22 84 34 112 64 112 C94 112 106 84 98 64 C92 46 82 42 64 42 C46 42 36 46 30 64 Z" fill="#FFAA80" stroke="#1B1B3A" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Potato freckles -->
    <circle cx="38" cy="74" r="2.5" fill="#C47A50"/>
    <circle cx="44" cy="94" r="3" fill="#C47A50"/>
    <circle cx="86" cy="88" r="2.5" fill="#C47A50"/>
    <circle cx="90" cy="68" r="2" fill="#C47A50"/>

    <!-- Cute eyes & mouth -->
    <circle cx="48" cy="68" r="5" fill="#1B1B3A"/>
    <circle cx="49" cy="66" r="1.5" fill="#FFFFFF"/>
    <circle cx="80" cy="68" r="5" fill="#1B1B3A"/>
    <circle cx="81" cy="66" r="1.5" fill="#FFFFFF"/>

    <!-- Blushing cheeks -->
    <ellipse cx="40" cy="76" rx="5" ry="3" fill="#FF5C8A"/>
    <ellipse cx="88" cy="76" rx="5" ry="3" fill="#FF5C8A"/>

    <!-- Happy smile -->
    <path d="M58 78 Q64 85 70 78" fill="none" stroke="#1B1B3A" stroke-width="3" stroke-linecap="round"/>

    <!-- Golden Crown -->
    <polygon points="44,22 52,38 64,18 76,38 84,22 88,48 40,48" fill="#FFD84D" stroke="#1B1B3A" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Jewels on crown -->
    <circle cx="44" cy="22" r="3" fill="#FF5C8A"/>
    <circle cx="64" cy="18" r="3.5" fill="#5EE6B0"/>
    <circle cx="84" cy="22" r="3" fill="#FF5C8A"/>
  </g>
</svg>
