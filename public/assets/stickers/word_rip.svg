<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#1B1B3A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tombstone outline -->
    <path d="M30 110 L30 52 C30 28 46 14 64 14 C82 14 98 28 98 52 L98 110 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M30 110 L30 52 C30 28 46 14 64 14 C82 14 98 28 98 52 L98 110 Z" fill="#DCEBFF" stroke="#1B1B3A" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Flowers at the base -->
    <circle cx="28" cy="108" r="8" fill="#FF5C8A" stroke="#1B1B3A" stroke-width="2.5"/>
    <circle cx="28" cy="108" r="3" fill="#FFD84D"/>
    <circle cx="100" cy="108" r="8" fill="#FF5C8A" stroke="#1B1B3A" stroke-width="2.5"/>
    <circle cx="100" cy="108" r="3" fill="#FFD84D"/>

    <!-- Cross engraving -->
    <path d="M64 26 L64 46 M54 34 L74 34" stroke="#1B1B3A" stroke-width="4" stroke-linecap="round"/>

    <!-- Text R.I.P. -->
    <text x="64" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1B1B3A" text-anchor="middle" letter-spacing="3">R.I.P.</text>

    <!-- Little crack on stone -->
    <path d="M78 48 L72 56 L76 62" fill="none" stroke="#1B1B3A" stroke-width="2" stroke-linecap="round"/>

    <!-- Ghost floating away from top -->
    <path d="M84 20 C84 14 88 10 92 10 C96 10 100 14 100 20 C100 24 98 26 96 26 C94 26 92 24 92 26 C90 26 88 24 86 26 C84 26 84 22 84 20 Z" fill="#FFFFFF" stroke="#1B1B3A" stroke-width="1.5"/>
    <circle cx="89" cy="16" r="1" fill="#1B1B3A"/>
    <circle cx="95" cy="16" r="1" fill="#1B1B3A"/>
  </g>
</svg>
