<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#1B1B3A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Crossbones outline -->
    <path d="M22 26 L106 102 M22 102 L106 26" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <circle cx="18" cy="22" r="8" fill="#FFFFFF"/>
    <circle cx="26" cy="18" r="8" fill="#FFFFFF"/>
    <circle cx="102" cy="110" r="8" fill="#FFFFFF"/>
    <circle cx="110" cy="102" r="8" fill="#FFFFFF"/>
    <circle cx="18" cy="106" r="8" fill="#FFFFFF"/>
    <circle cx="26" cy="110" r="8" fill="#FFFFFF"/>
    <circle cx="102" cy="18" r="8" fill="#FFFFFF"/>
    <circle cx="110" cy="26" r="8" fill="#FFFFFF"/>

    <!-- Crossbones inner -->
    <path d="M22 26 L106 102 M22 102 L106 26" stroke="#5EE6B0" stroke-width="12" stroke-linecap="round"/>
    <circle cx="18" cy="22" r="5" fill="#5EE6B0"/>
    <circle cx="26" cy="18" r="5" fill="#5EE6B0"/>
    <circle cx="102" cy="110" r="5" fill="#5EE6B0"/>
    <circle cx="110" cy="102" r="5" fill="#5EE6B0"/>
    <circle cx="18" cy="106" r="5" fill="#5EE6B0"/>
    <circle cx="26" cy="110" r="5" fill="#5EE6B0"/>
    <circle cx="102" cy="18" r="5" fill="#5EE6B0"/>
    <circle cx="110" cy="26" r="5" fill="#5EE6B0"/>

    <!-- Skull head outline -->
    <path d="M34 56 C34 32 46 18 64 18 C82 18 94 32 94 56 C94 68 88 74 86 82 L86 92 C86 96 82 100 78 100 L50 100 C46 100 42 96 42 92 L42 82 C40 74 34 68 34 56 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Skull head fill -->
    <path d="M34 56 C34 32 46 18 64 18 C82 18 94 32 94 56 C94 68 88 74 86 82 L86 92 C86 96 82 100 78 100 L50 100 C46 100 42 96 42 92 L42 82 C40 74 34 68 34 56 Z" fill="#F4F8FD" stroke="#1B1B3A" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Eye sockets -->
    <ellipse cx="50" cy="54" rx="10" ry="12" fill="#1B1B3A"/>
    <circle cx="48" cy="50" r="3" fill="#FF5C8A"/>
    <ellipse cx="78" cy="54" rx="10" ry="12" fill="#1B1B3A"/>
    <circle cx="76" cy="50" r="3" fill="#FF5C8A"/>

    <!-- Nose upside down heart -->
    <path d="M64 68 C61 65 59 69 64 75 C69 69 67 65 64 68 Z" fill="#1B1B3A"/>

    <!-- Teeth -->
    <path d="M50 86 L50 96 M57 86 L57 96 M64 86 L64 96 M71 86 L71 96 M78 86 L78 96" stroke="#1B1B3A" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
