    <ellipse cx="38" cy="62" rx="6" ry="3.5" fill="#FF5C8A" opacity="0.6"/>
    <ellipse cx="90" cy="62" rx="6" ry="3.5" fill="#FF5C8A" opacity="0.6"/>

    <!-- Big surprised mouth -->
    <ellipse cx="64" cy="68" rx="8" ry="12" fill="#1B1B3A"/>
    <ellipse cx="64" cy="74" rx="5" ry="4" fill="#FF5C8A"/>
